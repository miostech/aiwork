<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Work · MIAI Academy</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.miaiacademy.com/ia-work">
<!--
  /aiwork DA IA ACADEMY: o IA Work agora é vendido na MIAI Academy (www.miaiacademy.com/ia-work).
  Esta página só leva a pessoa para lá, mantendo o que vem no endereço (ex.: ?origem=curso, que preenche o cupom
  de quem fez o curso gratuito) e o id do cadastro dela (lead), que o curso gratuito guardou neste navegador.
  A página de vendas antiga está no histórico do Git.
-->
<!-- Conta a visita no painel (como antes) antes de sair da página -->
<script src="/contador.js" data-pagina="aiwork"></script>
<script>
(function () {
  'use strict';
  var destino = new URL('https://www.miaiacademy.com/ia-work');
  new URLSearchParams(location.search).forEach(function (valor, chave) { destino.searchParams.set(chave, valor); });
  try {
    var funil = JSON.parse(localStorage.getItem('inscricao-curso-gratuito')) || {};
    if (/^[0-9a-f-]{36}$/i.test(funil.leadId || '')) destino.searchParams.set('lead', funil.leadId);
  } catch (e) {}
  location.replace(destino.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://www.miaiacademy.com/ia-work"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F1EC; color: #14130F; font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
  a { color: #5E1D93; }
</style>
</head>
<body>
  <p>Levando você para o IA Work na MIAI Academy…<br><a href="https://www.miaiacademy.com/ia-work">Clique aqui se a página não abrir.</a></p>
</body>
